apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: false
    editable: true

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    uid: influxdb
    isDefault: true
    editable: true
    jsonData:
      version: Flux
      organization: myorg
      defaultBucket: ingress
    secureJsonData:
      token: influxdb-token
