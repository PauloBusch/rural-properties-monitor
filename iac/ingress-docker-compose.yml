services:
  ingress:
    build:
      context: ../src/Ingress
      dockerfile: Dockerfile
    container_name: ingress
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__Broker=kafka:9092
      - Kafka__Topic=sensor-data
      - Kafka__GroupId=ingress-group
      - InfluxDbConfig__Url=http://influxdb:8086
      - InfluxDbConfig__Token=influxdb-token
      - InfluxDbConfig__Org=myorg
      - InfluxDbConfig__Bucket=ingress
      - Keycloak__Authority=http://keycloak:8080/realms/RuralTech
      - Keycloak__Audience=ruraltech-services
      - Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET}
      - Keycloak__RequireHttpsMetadata=false
    depends_on:
      - influxdb
      - kafka
      - sensors
      - keycloak
    ports:
      - "5001:8080"

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=myorg
      - DOCKER_INFLUXDB_INIT_BUCKET=ingress
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=influxdb-token

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
