apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  labels:
    app: analytics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
    spec:
      containers:
        - name: analytics-api
          image: rural-properties-monitor-analytics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: Redis__ConnectionString
              value: "redis:6379"
            - name: Services__IngressApi
              value: "http://ingress:8080/api/Health/status"
            - name: Serilog__MinimumLevel
              value: "Information"