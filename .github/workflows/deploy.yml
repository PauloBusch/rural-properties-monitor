name: CI/CD - Test, Build and Deploy to Minikube

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests with coverage
        run: |
          dotnet test --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test_results.trx" --results-directory ./TestResults

      - name: Convert coverage to lcov
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:./**/coverage.cobertura.xml -targetdir:./TestResults/CoverageReport -reporttypes:lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport

      - name: Set up Minikube Docker environment
        run: |
          & minikube docker-env | Invoke-Expression
        shell: powershell

      - name: Build all images with Docker Compose
        run: docker compose build

      - name: Apply all Kubernetes manifests
        run: kubectl apply -f k8s/ --recursive

      - name: Show running pods
        run: kubectl get pods -o wide
